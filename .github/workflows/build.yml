name: Build Fakepixel Smooth FPS PRO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Extract source
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir project
          unzip Fakepixel_Smooth_FPS_PRO_Files.zip -d project

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-2.14.1-bin.zip -o gradle.zip
          unzip gradle.zip

      - name: Build mod
        run: |
          cd project/Fakepixel_Smooth_FPS_PRO
          ../../gradle-2.14.1/bin/gradle clean build

      - uses: actions/upload-artifact@v4
        with:
          name: Fakepixel-Smooth-FPS-PRO-1.8.9
          path: project/Fakepixel_Smooth_FPS_PRO/build/libs/*.jar
